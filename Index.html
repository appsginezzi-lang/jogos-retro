<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Jogar Sonic Classics Online</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .ad-container {
            margin: 15px auto;
            max-width: 728px;
            min-height: 90px;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #444;
        }
        #game-box {
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <h1>Sonic Classics (Mega Drive)</h1>

    <!-- ESPAÇO PARA ANÚNCIO DO TOPO -->
    <div class="ad-container">
        <!-- COLE O CÓDIGO DE ANÚNCIO 1 AQUI -->
    </div>

    <!-- TELA DO JOGO (EMULATORJS) -->
    <div id="game-box">
        <div id="game"></div>
    </div>

    <!-- ESPAÇO PARA ANÚNCIO INFERIOR -->
    <div class="ad-container">
        <!-- COLE O CÓDIGO DE ANÚNCIO 2 AQUI -->
    </div>

    <!-- CONFIGURAÇÃO DO EMULADOR -->

        EJS_player = '#game';
        EJS_core = 'segaMD';
