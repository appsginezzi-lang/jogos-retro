<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Retrô - Mega Drive</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { 
            background: linear-gradient(135deg, #b30000, #ff1a1a); 
            padding: 22px 15px; 
            text-align: center; 
            border-bottom: 4px solid #ffcc00; 
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }
        header h1 { 
            color: #ffffff; 
            font-size: 1.8rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 6px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        header p { 
            color: #ffcc00; 
            font-size: 0.95rem; 
            font-weight: bold; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        /* Frase de destaque */
        .sub-banner-text {
            background-color: #1a1a1a;
            color: #ffcc00;
            text-align: center;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-bottom: 1px solid #333;
            letter-spacing: 1px;
        }

        /* Contentor de anúncios adaptado a telemóveis (320x50) */
        .ad-banner { background-color: #1a1a1a; text-align: center; padding: 6px 0; margin: 10px auto; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 55px; }

        .container { max-width: 1200px; margin: 15px auto; padding: 0 12px; flex: 1; width: 100%; }
        
        /* Grelha de 2 colunas com quadrados GRANDES e espaçosos */
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        
        .game-card { 
            background-color: #1e1e1e; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.7); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            border: 1px solid #444; 
            padding: 22px 16px; 
            min-height: 155px; 
        }
        .game-card:hover { border-color: #ffcc00; }
        
        .game-info h3 { font-size: 1.05rem; margin-bottom: 16px; color: #fff; text-align: center; display: flex; align-items: center; justify-content: center; }
        
        .play-btn { background-color: #ffcc00; color: #121212; border: none; padding: 13px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; text-decoration: none; display: block; width: 100%; transition: background 0.2s; }
        .play-btn:hover { background-color: #e6b800; }

        #emulator-container { width: 100%; max-width: 800px; height: 420px; margin: 15px auto; background: #000; display: none; border-radius: 8px; overflow: hidden; border: 2px solid #ffcc00; }
        #emulator { width: 100%; height: 100%; }

        footer { background-color: #1f1f1f; text-align: center; padding: 12px; color: #888; font-size: 0.85rem; margin-top: auto; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <header>
        <h1>🕹️ JOGOS RETRÔ 🎮</h1>
        <p>⚡ Mega Drive ⚡</p>
    </header>

    <!-- Frase chamativa logo abaixo do cabeçalho -->
    <div class="sub-banner-text">
        🎮 Jogue jogos clássicos online direto no seu navegador!
    </div>

    <!-- Bloco de Anúncio Adsterra (Topo) -->
    <div class="ad-banner">
        <script type="text/javascript">
          atOptions = {
            'key' : '229b318e664ff028040d7f6ba2656701',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://bauval.org/22/229b318e664ff028040d7f6ba2656701"></script>
    </div>

    <div class="container">
        
        <div id="emulator-container">
            <div id="emulator"></div>
        </div>

        <h2 style="margin: 12px 0; font-size: 1.1rem; border-left: 3px solid #ffcc00; padding-left: 8px;">Biblioteca de Jogos</h2>

        <div class="game-grid">
            <!-- Aladdin -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Aladdin (Europe)</h3>
                    <button class="play-btn" onclick="iniciarJogo('Aladdin (Europe).md')">Jogar</button>
                </div>
            </div>

            <!-- Mega Bomberman -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Mega Bomberman</h3>
                    <button class="play-btn" onclick="iniciarJogo('Mega Bomberman.bin')">Jogar</button>
                </div>
            </div>

            <!-- Mortal Kombat 2 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Mortal Kombat 2</h3>
                    <button class="play-btn" onclick="iniciarJogo('Mortal Kombat 2.bin')">Jogar</button>
                </div>
            </div>

            <!-- Spider-Man -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Spider-Man</h3>
                    <button class="play-btn" onclick="iniciarJogo('Spider-Man.md')">Jogar</button>
                </div>
            </div>

            <!-- Streets of Rage -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Streets of Rage</h3>
                    <button class="play-btn" onclick="iniciarJogo('Streets of Rage.bin')">Jogar</button>
                </div>
            </div>

            <!-- Top Gear 2 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Top Gear 2</h3>
                    <button class="play-btn" onclick="iniciarJogo('Top Gear 2.bin')">Jogar</button>
                </div>
            </div>

            <!-- Toy Story -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Toy Story</h3>
                    <button class="play-btn" onclick="iniciarJogo('Toy Story.bin')">Jogar</button>
                </div>
            </div>

            <!-- Futebol -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Futebol</h3>
                    <button class="play-btn" onclick="iniciarJogo('futebol.bin')">Jogar</button>
                </div>
            </div>

            <!-- Sonic -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Sonic</h3>
                    <button class="play-btn" onclick="iniciarJogo('sonic.md')">Jogar</button>
                </div>
            </div>

            <!-- Street Fighter -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Street Fighter</h3>
                    <button class="play-btn" onclick="iniciarJogo('street-fighter.md')">Jogar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bloco de Anúncio Adsterra (Rodapé) -->
    <div class="ad-banner">
        <script type="text/javascript">
          atOptions = {
            'key' : '229b318e664ff028040d7f6ba2656701',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://bauval.org/22/229b318e664ff028040d7f6ba2656701"></script>
    </div>

    <footer>
        <p>&copy; 2026 Jogos Retrô</p>
    </footer>

    <script>
        function iniciarJogo(nomeRom) {
            const container = document.getElementById('emulator-container');
            const emulatorDiv = document.getElementById('emulator');
            
            container.style.display = 'block';
            container.scrollIntoView({ behavior: 'smooth' });

            emulatorDiv.innerHTML = '';

            window.EJS_player = '#emulator';
            window.EJS_gameUrl = nomeRom;
            window.EJS_core = 'segaMD';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            if (!document.getElementById('ejs-script')) {
                const script = document.createElement('script');
                script.id = 'ejs-script';
                script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
                document.body.appendChild(script);
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
