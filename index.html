<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Jogos Retrô</title>
  <style>
    body { background-color: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 10px; }
    .menu-jogos { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .btn-jogo { background-color: #ff4757; color: white; border: none; padding: 10px 15px; font-size: 0.9rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    #game-box { width: 100%; max-width: 800px; height: 500px; margin: 0 auto; border: 2px solid #333; border-radius: 8px; overflow: hidden; background-color: #000; }
  </style>
</head>
<body>

  <h1>🎮 Meus Jogos Retrô</h1>

  <div class="menu-jogos">
    <!-- Jogos de Mega Drive -->
    <button class="btn-jogo" onclick="carregarJogo('segaMD', 'https://appsginezzi-lang.github.io/meus-jogos-retro/sonic.md')">🔵 Sonic Classics</button>
    <button class="btn-jogo" onclick="carregarJogo('segaMD', 'https://appsginezzi-lang.github.io/meus-jogos-retro/futebol.bin')">⚽ ISS Deluxe</button>
    <button class="btn-jogo" onclick="carregarJogo('segaMD', 'https://appsginezzi-lang.github.io/meus-jogos-retro/street-fighter.md')">🥊 Street Fighter II</button>
    <button class="btn-jogo" onclick="carregarJogo('segaMD', 'https://appsginezzi-lang.github.io/meus-jogos-retro/Mega%20Bomberman.bin')">💣 Mega Bomberman</button>
  </div>

  <div id="game-box">
    <div id="game"></div>
  </div>

  <script type="text/javascript">
    function carregarJogo(sistema, rom) {
      document.getElementById('game').innerHTML = '';
      EJS_player = '#game';
      EJS_core = sistema;
      EJS_gameUrl = rom;
      EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      
      const oldScript = document.getElementById('ejs-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'ejs-script';
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);
    }

    // Carrega o Sonic por defeito ao abrir
    carregarJogo('segaMD', 'https://appsginezzi-lang.github.io/meus-jogos-retro/sonic.md');
  </script>
</body>
</html>
