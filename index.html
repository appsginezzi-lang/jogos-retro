<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jogos Retrô - Portal Mega Drive</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1f1f1f; padding: 15px; text-align: center; border-bottom: 3px solid #ffcc00; }
        header h1 { color: #ffcc00; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .ad-banner { background-color: #222; border: 1px dashed #444; color: #777; text-align: center; padding: 8px; margin: 10px auto; width: 100%; max-width: 728px; font-size: 0.8rem; }

        .container { max-width: 1200px; margin: 10px auto; padding: 0 10px; flex: 1; width: 100%; }
        
        /* Grelha ajustada para telemóveis (2 colunas lado a lado) */
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        
        .game-card { background-color: #1e1e1e; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #333; padding: 10px; }
        .game-card:hover { border-color: #ffcc00; }
        
        .game-info h3 { font-size: 0.9rem; margin-bottom: 8px; color: #fff; text-align: center; min-height: 2.6em; display: flex; align-items: center; justify-content: center; }
        
        .play-btn { background-color: #ffcc00; color: #121212; border: none; padding: 8px; font-size: 0.85rem; font-weight: bold; border-radius: 4px; cursor: pointer; text-align: center; text-decoration: none; display: block; width: 100%; transition: background 0.2s; }
        .play-btn:hover { background-color: #e6b800; }

        #emulator-container { width: 100%; max-width: 800px; height: 400px; margin: 15px auto; background: #000; display: none; border-radius: 6px; overflow: hidden; border: 2px solid #ffcc00; }
        #emulator { width: 100%; height: 100%; }

        footer { background-color: #1f1f1f; text-align: center; padding: 10px; color: #888; font-size: 0.8rem; margin-top: auto; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Meus Jogos Retrô</h1>
    </header>

    <div class="ad-banner">
        Espaço para Anúncio / Banner de Monetização
    </div>

    <div class="container">
        
        <div id="emulator-container">
            <div id="emulator"></div>
        </div>

        <h2 style="margin: 10px 0; font-size: 1.1rem; border-left: 3px solid #ffcc00; padding-left: 8px;">Biblioteca de Jogos</h2>

        <div class="game-grid">
            <!-- Jogo 1 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Aladdin (Europe)</h3>
                    <button class="play-btn" onclick="iniciarJogo('Aladdin (Europe).md')">Jogar</button>
                </div>
            </div>

            <!-- Jogo 2 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Dragon Ball Z</h3>
                    <button class="play-btn" onclick="iniciarJogo('Dragon Ball Z - Buyuu Retsuden (....md')">Jogar</button>
                </div>
            </div>

            <!-- Jogo 3 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Mega Bomberman</h3>
                    <button class="play-btn" onclick="iniciarJogo('Mega Bomberman.bin')">Jogar</button>
                </div>
            </div>

            <!-- Jogo 4 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Mortal Kombat 2</h3>
                    <button class="play-btn" onclick="iniciarJogo('Mortal Kombat 2.bin')">Jogar</button>
                </div>
            </div>

            <!-- Jogo 5 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Streets of Rage</h3>
                    <button class="play-btn" onclick="iniciarJogo('Streets of Rage.bin')">Jogar</button>
                </div>
            </div>

            <!-- Jogo 6 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Tiny Toon Adventures</h3>
                    <button class="play-btn" onclick="iniciarJogo('Tiny Toon Adventures - Buster\'s ....bin')">Jogar</button>
                </div>
            </div>

            <!-- Jogo 7 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Top Gear 2</h3>
                    <button class="play-btn" onclick="iniciarJogo('Top Gear 2.bin')">Jogar</button>
                </div>
            </div>

            <!-- Jogo 8 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Futebol</h3>
                    <button class="play-btn" onclick="iniciarJogo('futebol.bin')">Jogar</button>
                </div>
            </div>

            <!-- Jogo 9 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Sonic</h3>
                    <button class="play-btn" onclick="iniciarJogo('sonic.md')">Jogar</button>
                </div>
            </div>

            <!-- Jogo 10 -->
            <div class="game-card">
                <div class="game-info">
                    <h3>Street Fighter</h3>
                    <button class="play-btn" onclick="iniciarJogo('street-fighter.md')">Jogar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="ad-banner">
        Espaço para Anúncio / Rodapé
    </div>

    <footer>
        <p>&copy; 2026 Meus Jogos Retrô</p>
    </footer>

    <script>
        function iniciarJogo(nomeRom) {
            const container = document.getElementById('emulator-container');
            const emulatorDiv = document.getElementById('emulator');
            
            container.style.display = 'block';
            container.scrollIntoView({ behavior: 'smooth' });

            emulatorDiv.innerHTML = '';

            window.EJS_player = '#emulator';
            window.EJS_gameUrl = nomeRom;
            window.EJS_core = 'segaMD';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            if (!document.getElementById('ejs-script')) {
                const script = document.createElement('script');
                script.id = 'ejs-script';
                script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
                document.body.appendChild(script);
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
